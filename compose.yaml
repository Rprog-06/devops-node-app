services:
  app:
    build: .
    image: devops-node-app:slim
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://mongodb:27017
    depends_on:
      - mongodb
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const http = require('http'); Promise.all(['/', '/db'].map(path => new Promise((resolve, reject) => { const req = http.get('http://localhost:3000' + path, res => { res.resume(); res.statusCode === 200 ? resolve() : reject(new Error(path + ': HTTP ' + res.statusCode)); }); req.on('error', reject); req.setTimeout(4000, () => req.destroy(new Error('timeout'))); }))).then(() => process.exit(0)).catch(() => process.exit(1));"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
   

volumes:
  mongo_data:
